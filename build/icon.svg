<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="0.55" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#4d4d4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.2" y1="0.15" x2="0.8" y2="0.85">
      <stop offset="0" stop-color="#f3f3f3"/>
      <stop offset="0.55" stop-color="#d7d7d7"/>
      <stop offset="1" stop-color="#b0b0b0"/>
    </linearGradient>
    <filter id="tile-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <g filter="url(#tile-shadow)">
    <rect x="202" y="202" width="620" height="620" rx="132" fill="url(#bg)"/>
    <rect x="202" y="202" width="620" height="620" rx="132" fill="url(#glow)"/>
  </g>

  <g fill="none" stroke="url(#ring)" filter="url(#soft-shadow)">
    <circle cx="512" cy="512" r="214" stroke-width="18" opacity="0.94"/>
    <circle cx="512" cy="512" r="154" stroke-width="30" opacity="0.97"/>
    <circle cx="512" cy="512" r="91" stroke-width="24" opacity="0.98"/>
    <circle cx="512" cy="512" r="38" stroke-width="16" opacity="0.98"/>
  </g>

  <circle cx="512" cy="512" r="12" fill="#d2d2d2"/>
</svg>
