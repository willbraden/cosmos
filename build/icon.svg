<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="0.55" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#4d4d4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.2" y1="0.15" x2="0.8" y2="0.85">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="0.55" stop-color="#d9d9d9"/>
      <stop offset="1" stop-color="#b5b5b5"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect x="138" y="138" width="748" height="748" rx="144" fill="url(#bg)"/>
  <rect x="138" y="138" width="748" height="748" rx="144" fill="url(#glow)"/>

  <g fill="none" stroke="url(#ring)" filter="url(#soft-shadow)">
    <circle cx="512" cy="512" r="266" stroke-width="20" opacity="0.95"/>
    <circle cx="512" cy="512" r="192" stroke-width="36" opacity="0.98"/>
    <circle cx="512" cy="512" r="114" stroke-width="30" opacity="0.98"/>
    <circle cx="512" cy="512" r="48" stroke-width="20" opacity="0.98"/>
  </g>

  <circle cx="512" cy="512" r="14" fill="#cfcfcf"/>
</svg>
